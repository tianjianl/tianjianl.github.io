# Preview the `academic` theme locally without touching the main al-folio site.
# Run from inside this `academic/` folder:  docker compose up
# Then open http://localhost:4001
services:
  jekyll:
    image: jekyll/jekyll:4.2.2
    container_name: academic-preview
    command: bash -c "
      rm -f Gemfile.lock
      && bundle install
      && bundle exec jekyll serve --watch --port=4001 --host=0.0.0.0 --force_polling"
    ports:
      - 4001:4001
    volumes:
      - .:/srv/jekyll
