selected:
- title: 'Self-Compacting Language Model Agents'
  authors: 'Tianjian Li, Jingyu Zhang, William Jurayj, Xi Wang, Chuanyang Jin, Mehrdad Farajtabar, Eric Nalisnick, Daniel Khashabi'
  venue: 'arXiv preprint'
  url: 'https://arxiv.org/abs/2606.23525'
  image: 'assets/img/selfcompact.png'
  abstract: 'We let the model itself decide when and how to compact its own context, pairing a compaction tool with a lightweight rubric for when to fire and when to hold off. This self-compaction matches or beats fixed-interval summarization while using 30-70% less context budget.'
- title: 'ParaGator: Learning to Aggregate through Online RL'
  authors: 'Tianjian Li, Jingyu Zhang, Ping Yu, Swarnadeep Saha, Sainbayar Sukhbaatar, Jason Weston, Ilia Kulikov, Jack Lanchantin'
  venue: 'arXiv preprint'
  url: 'https://facebookresearch.github.io/RAM/blogs/paragator/'
  image: 'assets/img/paragator.png'
  abstract: 'We study parallel reasoning, where a generator proposes multiple candidate solutions and an aggregator synthesizes them into a final answer. ParaGator trains both stages together end-to-end: the generator is optimized for diverse candidates with pass@k while the aggregator is optimized with pass@1, yielding large gains on competition math and scientific reasoning.'
- title: 'Jointly Reinforcing Diversity and Quality in Language Model Generations'
  authors: 'Tianjian Li, Yiming Zhang, Ping Yu, Swarnadeep Saha, Daniel Khashabi, Jason Weston, Jack Lanchantin, Tianlu Wang'
  venue: 'Scaling Post-Training (SPOT) Workshop, ICLR 2026'
  url: 'https://arxiv.org/abs/2509.02534'
  code: 'https://github.com/facebookresearch/darling'
  image: 'assets/img/darling.png'
  abstract: 'We propose Darling, an online reinforcement learning method that jointly optimizes for the diversity and quality of language model generations. Darling encourages models to produce varied outputs without sacrificing correctness, improving performance on open-ended generation tasks.'
- title: 'Error Norm Truncation: Robust Training in the Presence of Data Noise for Text Generation Models'
  authors: 'Tianjian Li, Haoran Xu, Philipp Koehn, Daniel Khashabi, Kenton Murray'
  venue: 'ICLR 2024 <span style="color:red">(Spotlight, Top 5%)</span>'
  url: 'https://arxiv.org/abs/2310.00840'
  code: 'https://github.com/tianjianl/error_norm_truncation'
  image: 'assets/img/error_norm_truncation.png'
  abstract: 'We propose Error Norm Truncation, a robust training objective that down-weights noisy training examples using a more accurate estimate of sample quality than the loss alone. It improves the quality and robustness of text generation models across machine translation, summarization, and language modeling.'

